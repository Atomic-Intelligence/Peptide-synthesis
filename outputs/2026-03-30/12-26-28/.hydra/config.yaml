paths:
  root_data_path: //home/mirksonius/Peptide-synthesis/resources
  synthetic_data_dir: ${.root_data_path}/synthetic_datasets/
  real_dataset_path: ${.root_data_path}/merged_peptide_and_clinical.csv
  synthetic_dataset_path: ${.synthetic_data_dir}
  run_dir: ./
data_processor:
  _target_: src.data.utils.DataProcessor
  id_column: idAuswertung
  clinical_columns:
  - Geschlecht (1=female)
  - Kidney disease
  - diabetes
  - CVD
  - hypertension
  - Blutdruck, diastolischM
  - Blutdruck, systolischM
  - GFR_CKD_EPI_M
  - BMI_M
  - Alter_M
  - time-to-CKDevent(to event or last visit)
  - FU duration_CAD_Hfevent (to event or last visit)
model:
  _target_: src.models.copulas.gaussian_copula.gaussian_copula_basic.GaussianCopulaBasic
  marginal_distribution_estimator:
    _target_: src.models.copulas.marginal_distributions.marginal_distribution_estimator.MarginalDistributionEstimator
    continuous_distributions:
    - stats.beta
    - stats.norm
    - stats.lognorm
    - stats.truncnorm
    - stats.gamma
    - stats.t
    - stats.uniform
    - stats.expon
    univariate_distribution_metric:
      _target_: src.models.copulas.marginal_distributions.marginal_distribution_metrics.KullbackLeiblerDivergence
    categorical_encoding: truncated_gaussian
    use_zero_inflated: true
    kde_fallback: false
    kde_min_ks_pvalue: 0.05
  sdv_preprocessor:
    _target_: src.models.copulas.gaussian_copula.preprocessing.SDVPreprocessor
    categorical_encoding: truncated_gaussian
  ml_flow_info:
    experiment_name: ${experiment_name}
    run_name: ${run_name}
  categorical_columns:
  - Geschlecht (1=female)
  - Kidney disease
  - diabetes
  - CVD
  - hypertension
  - event_type
  copula_type: gaussian
  corr_method: pearson
  student_t_df: null
  student_t_df_grid:
  - 2
  - 3
  - 5
  - 10
  - 20
  - 50
  peptide_non_negative: true
  clip_columns: {}
inference:
  _target_: src.inference.inference_runner.InferenceRunner
  synthetic_dataset_path: ${paths.synthetic_dataset_path}
  inference_run_name: synthetization
  n_synthetic_patients: 20
imputation:
  _target_: src.models.Imputation.HistogramImputation.HistogramImputation
  num_bins: 100
  sampling_strategy: uniform
  n_jobs: 1
run_training: true
run_inference: true
event: no_event
experiment_name: restart
run_name: NE
sampled_patients_num: 2000
non_zero_threshold: 40.0
ml_flow_tracking_uri: http://10.100.111.210:5002
primary_key: ${data_processor.id_column}
