paths:
  root_data_path: /data1/prostrat-ai
  synthetic_data_dir: ${.root_data_path}/synthetic_datasets
  save_data_path: ${.synthetic_data_dir}
  real_data_path: ${.root_data_path}/data/peptide_and_clinical_data_v2.csv
  synthetic_data_path: /home/fmirkovic/data1/prostrat-ai/synthetic_datasets/arf_event_all_hilarious-hen-621/arf_generated.csv
  run_dir: ./
data_processor:
  _target_: src.data.utils.DataProcessor
  clinical_columns:
  - Geschlecht (1=female)
  - Kidney disease
  - diabetes
  - CVD
  - hypertension
  - Blutdruck, diastolischM
  - Blutdruck, systolischM
  - GFR_CKD_EPI_M
  - BMI_M
  - Alter_M
  - time-to-CKDevent(to event or last visit)
  - FU duration_CAD_Hfevent (to event or last visit)
model:
  _target_: tests.mock.dummy_model.DummySynthetizationModel.load_pretrained_from_mlflow_run
  ml_flow_info:
    _target_: src.models.synthetization_model_interface.MlFlowTrainingRunInfo
    experiment_name: ${experiment_name}
    run_name: ${run_name}
inference:
  _target_: src.inference.inference_runner.InferenceRunner
  synthetic_dataset_path: ${paths.synthetic_dataset_path}
  inference_run_name: hydra_testing_run
  n_synthetic_patients: 10
run_training: false
run_inference: true
run_evaluation: true
experiment_name: Dummy experiment
run_name: dummy_run_6
