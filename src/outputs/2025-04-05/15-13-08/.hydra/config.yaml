data_processor:
  _target_: src.data.utils.DataProcessor
  clinical_columns:
  - Geschlecht (1=female)
  - Kidney disease
  - diabetes
  - CVD
  - hypertension
  - Blutdruck, diastolischM
  - Blutdruck, systolischM
  - GFR_CKD_EPI_M
